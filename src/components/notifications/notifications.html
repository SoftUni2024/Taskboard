<div class="toast app-toast" aria-atomic="true" role="group">
  <div class="app-toast-inner">
    <span class="app-toast-icon" aria-hidden="true" data-icon></span>
    <div class="app-toast-content">
      <strong data-title></strong>
      <p data-message></p>
    </div>
    <button
      type="button"
      class="app-toast-close"
      aria-label="Dismiss notification"
    >
      ×
    </button>
  </div>
</div>
