<section class="task-comments mt-4" aria-label="Task discussion">
  <h3>Discussion</h3>
  <p class="small text-muted" data-comment-hint>
    Keep questions, decisions, and updates together. Comments save separately
    from task details.
  </p>
  <label class="form-label" for="task-comment-body">New comment</label
  ><textarea
    id="task-comment-body"
    class="form-control"
    rows="3"
    maxlength="4000"
    placeholder="Write a comment…"
    data-comment-draft
  ></textarea>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-muted" data-comment-count>0 / 4000</small
    ><button type="button" class="btn btn-primary btn-sm" data-post-comment>
      Post comment
    </button>
  </div>
  <p class="small text-muted mt-3" data-comment-status role="status"></p>
  <ol class="task-comment-list" data-comment-list></ol>
  <button
    type="button"
    class="btn btn-outline-primary btn-sm"
    data-older-comments
    hidden
  >
    Load older comments
  </button>
</section>
