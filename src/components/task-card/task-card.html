<article class="task-card" tabindex="0" role="button" draggable="true">
  <div class="task-card-top">
    <span class="task-tag"></span
    ><span aria-hidden="true" class="task-grip">⠿</span>
  </div>
  <h3></h3>
  <p data-excerpt></p>
  <footer>
    <span data-description-icon></span><small data-task-id></small>
    <div class="reorder-controls">
      <button
        type="button"
        class="btn btn-sm"
        data-up
        aria-label="Move task up"
      >
        ↑</button
      ><button
        type="button"
        class="btn btn-sm"
        data-down
        aria-label="Move task down"
      >
        ↓
      </button>
    </div>
  </footer>
</article>
