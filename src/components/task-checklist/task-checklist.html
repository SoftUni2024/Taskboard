<section class="task-checklist" aria-label="Task checklist">
  <h3>Checklist</h3>
  <p class="form-text">Items save immediately, separately from task details.</p>
  <p data-check-status role="status">Loading checklist…</p>
  <ol data-check-items></ol>
  <div class="d-flex gap-2"><input data-check-new class="form-control" maxlength="200" aria-label="New checklist item" placeholder="Add a checklist item"><button type="button" class="btn btn-outline-primary" data-check-add>Add item</button></div>
</section>
