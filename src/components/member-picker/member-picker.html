<label class="form-label" for="member-search">Search app users</label>
<input
  id="member-search"
  type="search"
  class="form-control mb-3"
  placeholder="Search by name or email"
  autocomplete="off"
/>
<p class="small text-muted" data-picker-status role="status"></p>
<ul class="member-picker-list" data-users></ul>
<button
  type="button"
  class="btn btn-outline-primary btn-sm mt-3"
  data-more
  hidden
>
  Load more users
</button>
