<form class="project-details-form surface">
  <fieldset>
    <div class="mb-4">
      <label class="form-label" for="project-title"
        >Title <span class="text-muted">(required)</span></label
      ><input
        id="project-title"
        name="title"
        class="form-control"
        required
        maxlength="120"
        placeholder="What are we working on?"
        autocomplete="off"
      />
    </div>
    <div>
      <label class="form-label" for="project-description">Description</label
      ><textarea
        id="project-description"
        name="description"
        class="form-control"
        rows="7"
        maxlength="2000"
        aria-describedby="project-description-help"
        placeholder="A few words about the bigger picture…"
      ></textarea>
      <div class="description-help" id="project-description-help">
        <span>Give the work a little context.</span
        ><span data-description-count>0 / 2000</span>
      </div>
    </div>
    <div class="project-form-actions">
      <a class="btn btn-outline-secondary" href="/projects" data-link>Cancel</a
      ><button class="btn btn-primary" type="submit" data-save>
        Create project →
      </button>
    </div>
  </fieldset>
</form>
