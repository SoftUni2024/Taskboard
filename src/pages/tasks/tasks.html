<section>
  <a class="small text-muted text-decoration-none" data-link href="/projects"
    >← All projects</a
  >
  <div class="page-heading mt-4">
    <div>
      <div class="eyebrow">PROJECT WORKSPACE</div>
      <h1 data-title></h1>
      <p data-description></p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <a class="btn btn-outline-primary" data-link data-labels-page>Labels</a>
      <a class="btn btn-outline-primary" data-link data-deadlines-page>Deadlines</a>
      <a class="btn btn-outline-primary" data-link data-activity-page>Activity</a>
      <button class="btn btn-outline-primary" data-settings>Edit project</button
      ><button class="btn btn-primary" data-add>＋ Add task</button>
    </div>
  </div>
  <div class="board-toolbar">
    <span class="board-tab">▱ Board <small data-count></small></span>
    <div class="d-flex gap-3 align-items-center">
      <span class="text-muted small d-none d-lg-inline"
        >Drag tasks to move & reorder</span
      ><input
        class="form-control search-box"
        type="search"
        aria-label="Search tasks"
        placeholder="Find a task…"
      />
    </div>
  </div>
  <div
    class="task-board"
    data-columns
    role="region"
    aria-label="Project task board"
    tabindex="0"
  ></div>
  <div class="d-flex justify-content-between align-items-center mt-4">
    <div class="d-flex flex-wrap gap-3">
      <small class="text-muted" data-status
        >● All changes saved to your workspace</small
      ><small class="text-muted" data-sync role="status"
        >Connecting live updates…</small
      >
    </div>
    <button class="btn btn-link text-muted btn-sm" data-refresh>
      Refresh board
    </button>
  </div>
</section>
