<section>
  <div class="page-heading">
    <div>
      <div class="eyebrow">YOUR WORKSPACE, YOUR WAY</div>
      <h1>Account settings</h1>
      <p>A few details to make this space yours.</p>
    </div>
    <a class="btn btn-outline-primary" href="/dashboard" data-link
      >← Dashboard</a
    >
  </div>
  <div class="surface content-panel">
    <form>
      <div class="mb-4">
        <label for="profile-name" class="form-label">Display name</label
        ><input
          class="form-control"
          name="name"
          id="profile-name"
          maxlength="80"
          required
        />
      </div>
      <div class="mb-3">
        <label for="profile-email" class="form-label">Email address</label
        ><input class="form-control" id="profile-email" readonly />
      </div>
      <p class="small text-muted mb-4">
        Your account is secured with Supabase Auth. Your email is used to log
        in.
      </p>
      <div class="d-flex align-items-center justify-content-between">
        <button class="btn btn-primary">Save changes ✓</button
        ><button
          type="button"
          class="btn btn-link small text-muted"
          data-logout
        >
          Log out
        </button>
      </div>
    </form>
  </div>
</section>
